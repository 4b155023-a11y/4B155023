<!DOCTYPE html>
<html>
<head>
    <title>機車品牌及習慣問卷</title>
    <meta charset="utf-8">
    <link rel="icon" sizes="144x144" href="pic/name.png">
    
    <!-- 補回正確的 Font Awesome 4.7.0 圖示樣式庫 -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- 補回正確的 W3.CSS 樣式庫（才能實現置中與美化效果） -->
    <link rel="stylesheet" href="https://w3schools.com">
    
   <style>
    body { background: rgb(215, 204, 204); }
    nav { width: 100%; background: antiquewhite; padding: 10px; }
    nav a { color: #6a1b9a; text-decoration: none; font-size: 28px; font-weight: bold; margin-right: 10px; }
    nav a:hover { color: #8e24aa; }
    .container { width: 80%; margin: auto; background: white; padding: 20px; margin-top: 20px; border-radius: 10px; }
    .question { margin-bottom: 20px; }
    .desc { color: gray; }

    /*  以下這兩行是關鍵！直接強制讓標題與按鈕區塊置中 */
    h1.w3-center, .w3-center { 
        text-align: center !important; 
    }
</style>

</head>
<body>

    <!-- 導覽列移至 body 內部 -->
    <nav>
        <h1>
            <a href="index.html"><i class="fa fa-home"></i> 首頁</a>
            <a href="aboutme.html"><i class="fa fa-question-circle"></i> 關於我</a>
            <a href="album.html"><i class="fa fa-image"></i> 作品集</a>
            <a href="questionnaire.html"><i class="fa fa-list-alt"></i> 問卷</a>
            <a href="ex2.html"><i class="fa fa-envelope"></i> 關於此網站</a>
        </h1>
    </nav>

<div class="container">
    <!-- 修正問卷大標題文字 -->
    <h1 class="w3-center">機車品牌及習慣問卷</h1>

    <form>
        <fieldset>
            <legend>問卷內容</legend>

            <!-- 1 -->
            <div class="question">
                <h3>1. 是否有駕照</h3>
                <label><input type="checkbox" name="license" value="yes"> 是</label>
                <!-- 修正落單與錯誤的 label 標籤 -->
                <label><input type="checkbox" name="license" value="no"> 否</label>
            </div>

            <hr>

            <!-- 2 -->
            <div class="question">
                <h3>2. 機車品牌</h3>
                <!-- 修正單選鈕的 name 屬性為 motor-brand，並補上 YAMAHA 漏掉的 Y -->
                <label><input type="radio" name="motor-brand" value="SYM"> SYM 三陽機車</label><br>
                <label><input type="radio" name="motor-brand" value="KYMCO"> KYMCO 光陽機車</label><br>
                <label><input type="radio" name="motor-brand" value="YAMAHA"> YAMAHA 山葉機車</label><br>
                <label><input type="radio" name="motor-brand" value="Vespa"> Vespa 偉士牌</label><br>
                <label><input type="radio" name="motor-brand" value="Gogoro"> Gogoro</label><br>
                <label><input type="radio" name="motor-brand" value="others"> 其他</label><br>
            </div>

            <hr>

            <!-- 3 -->
            <div class="question">
                <h3>3. 騎乘頻率（單次平均時間）</h3>
                <select class="w3-select" name="frequency">
                    <option value="" disabled selected>請選擇</option>
                    <option value="under30">30 分鐘以下</option>
                    <option value="30to1h">30 分鐘 ~ 1 小時</option>
                    <option value="1hto2h">1 小時 ~ 2 小時</option>
                    <option value="over2h">2 小時以上</option>
                </select>
            </div>

            <hr>

            <!-- 4 -->
            <div class="question">
                <h3>4. 騎乘用途 （可複選）</h3>
                <label><input type="checkbox" name="purpose" value="commute"> 打工/上學通勤</label><br>
                <label><input type="checkbox" name="purpose" value="local"> 附近代步</label><br>
                <label><input type="checkbox" name="purpose" value="touring"> 跑山 / 夜衝夜遊</label><br>
                <label><input type="checkbox" name="purpose" value="passenger"> 載同學 / 載另一半</label>
            </div>

            <hr>

            <!-- 5 -->
            <div class="question">
                <h3>5. 您認為機車哪項「實用設計」最重要</h3>
                <select class="w3-select" name="feature">
                    <option value="" disabled selected>請選擇</option>
                    <option value="1">車廂空間大</option>
                    <option value="2">USB 充電座</option>
                    <option value="3">前腳踏空間寬敞</option>
                    <!-- 修正重複的 value="3" 改為 "4" -->
                    <option value="4">車身輕巧、中柱好立</option>
                </select>
            </div>

            <hr>

            <!-- 6 -->
            <div class="question">
                <h3>6. 請輸入您最想要的摩托車</h3>
                <input type="text" class="w3-input w3-border" placeholder="例如：杜卡迪">
            </div>

            <hr>

            <!-- 7 -->
            <div class="question">
                <h3>7. 能接受機車的價格上限多少</h3>
                <input type="number" min="0" class="w3-input w3-border" placeholder="例如：90000">
            </div>

            <hr>

            <!-- 8 -->
            <div class="question">
                <h3>8. 請分享您在校園騎車、停車或選購機車時，遇過最困擾的一件事</h3>
                <textarea rows="5" class="w3-input w3-border" placeholder="請輸入您的看法..."></textarea>
            </div>

            <br>

            
            <div class="w3-center">
                <button type="submit" class="w3-button w3-green w3-round-large">送出</button>
                <button type="reset" class="w3-button w3-red w3-round-large">重設</button>
            </div>

        </fieldset>
    </form>
</div>

</body>
</html>
